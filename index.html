<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You</title>
  
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff;
      text-align: center;
      overflow: hidden;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 3rem 2rem;
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      max-width: 480px;
      width: 90%;
    }

    /* Animovaný nápis Thank You */
    .thank-you-title {
      font-size: 3.5rem;
      font-weight: 800;
      background: linear-gradient(45deg, #38bdf8, #818cf8, #c084fc);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
      opacity: 0;
      transform: scale(0.5);
      animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards,
                 pulse 3s ease-in-out infinite 0.8s;
    }

    .message {
      font-size: 1.125rem;
      color: #94a3b8;
      margin-bottom: 2rem;
      line-height: 1.6;
      opacity: 0;
      animation: fadeIn 0.8s ease-out 0.4s forwards;
    }

    .btn {
      display: inline-block;
      padding: 0.8rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      border: none;
      border-radius: 50px;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
      opacity: 0;
      animation: fadeIn 0.8s ease-out 0.6s forwards;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(99, 102, 241, 0.6);
    }

    /* Kľúčové snímky pre animácie */
    @keyframes popIn {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.05);
      }
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1 class="thank-you-title">Thank You!</h1>
    <p class="message">Your message has been sent successfully. We will get back to you as soon as possible.</p>
    <a href="https://abcweb.ing" class="btn">Back to Main Page</a>
  </div>

  <script>
    // Spustenie konfiet po načítaní stránky
    window.addEventListener('DOMContentLoaded', () => {
      // Prvý výstreL
      confetti({
        particleCount: 100,
        spread: 70,
        origin: { y: 0.6 }
      });

      // Druhá jemná vlna z bokov
      setTimeout(() => {
        confetti({
          particleCount: 50,
          angle: 60,
          spread: 55,
          origin: { x: 0 }
        });
        confetti({
          particleCount: 50,
          angle: 120,
          spread: 55,
          origin: { x: 1 }
        });
      }, 400);
    });
  </script>

</body>
</html>
